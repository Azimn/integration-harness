name: CI

on:
  push:
    branches: [main, "bootstrap-*", "experiment-*"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run deterministic tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Validate donor, review, and review-coverage artifacts
        env:
          PYTHONPATH: src
        run: >-
          python -m integration_harness donors/registry.json reviews
          --require-review-gate --head "$GITHUB_SHA" --repo-root .
